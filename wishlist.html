<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist Merchandise Favorit — WOLVY Campus Streetwear</title>
  <meta name="description" content="Simpan dan pantau koleksi merchandise kampus favoritmu sebelum kehabisan stok limited edition.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .wishlist-layout {
      padding: 110px 0 80px 0;
      background: #FAF8FF;
      color: var(--color-text-dark);
      min-height: 85vh;
    }
    .wishlist-header-box {
      margin-bottom: 30px;
    }
    .wishlist-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .wishlist-main-title {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 900;
      color: var(--color-dark-purple);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .wishlist-category-pills {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-top: 20px;
      border-bottom: 1.5px solid #EBE3F8;
    }
    .w-pill-btn {
      padding: 10px 20px;
      background: #FFFFFF;
      border: 1.5px solid rgba(205, 184, 244, 0.4);
      border-radius: var(--radius-pill);
      font-size: 0.88rem;
      font-weight: 700;
      color: #6C568E;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .w-pill-btn:hover {
      border-color: var(--color-mid-purple);
      color: var(--color-dark-purple);
    }
    .w-pill-btn.active {
      background: var(--color-dark-purple);
      color: #FFFFFF;
      border-color: var(--color-dark-purple);
      box-shadow: 0 4px 12px rgba(37, 18, 63, 0.2);
    }

    /* Wishlist Grid */
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 28px;
    }
    .w-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      border: 1.5px solid rgba(205, 184, 244, 0.35);
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(98, 45, 170, 0.06);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .w-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 35px rgba(98, 45, 170, 0.12);
      border-color: var(--color-mid-purple);
    }
    .w-img-box {
      width: 100%;
      height: 220px;
      background: #F4EFFF;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .w-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s;
    }
    .w-card:hover .w-img {
      transform: scale(1.05);
    }
    .btn-remove-fav {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 1.5px solid #FFD0D0;
      color: #FF3B30;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: all 0.2s;
    }
    .btn-remove-fav:hover {
      background: #FFF1F0;
      transform: scale(1.1);
    }
    .w-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--color-neon-yellow);
      color: #000;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }
    .w-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .w-cat {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--color-mid-purple);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .w-title {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--color-dark-purple);
      margin-bottom: 8px;
      text-decoration: none;
      line-height: 1.3;
    }
    .w-title:hover {
      color: var(--color-mid-purple);
    }
    .w-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid #F0E8FF;
    }
    .w-price {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--color-dark-purple);
    }
    .btn-add-cart-w {
      padding: 8px 16px;
      background: var(--color-dark-purple);
      color: #FFFFFF;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-add-cart-w:hover {
      background: var(--color-neon-yellow);
      color: #000000;
    }

    /* Empty state */
    .wishlist-empty-state {
      text-align: center;
      padding: 60px 20px;
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      border: 1.5px dashed rgba(205, 184, 244, 0.5);
      margin-top: 28px;
    }
  </style>
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="header" id="mainHeader">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" aria-label="WOLVY Home">
        <img src="assets/wolvy_logo_clean.png" alt="WOLVY Logo" class="brand-logo-img">
      </a>
      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="tryon.html" class="nav-link nav-highlight">
          Try On <span class="badge-pill">LIVE CV</span>
        </a>
        <a href="index.html#custom-merch" class="nav-link">Custom Merch</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
      <div class="nav-actions">
        <a href="orders.html" class="nav-link" style="font-size:0.85rem; font-weight:700; color:var(--color-neon-yellow); margin-right:12px;">
          Pesanan Saya
        </a>
        <a href="wishlist.html" class="icon-btn active" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#FF3B30" stroke="#FF3B30" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          <span class="badge-count" id="wishlistCount">4</span>
        </a>
        <a href="cart.html" class="icon-btn cart-btn" aria-label="Keranjang">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span class="badge-count" id="cartBadge">3</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN WISHLIST ==================== -->
  <main class="wishlist-layout">
    <div class="section-container">
      
      <div class="wishlist-header-box">
        <div class="wishlist-title-row">
          <h1 class="wishlist-main-title">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="#FF3B30" stroke="#FF3B30" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            Wishlist Saya (<span id="totalWishlistCount">4</span>)
          </h1>
          <a href="shop.html" class="btn btn-primary" style="font-size:0.85rem; padding:10px 20px;">
            + Tambah Koleksi Baru
          </a>
        </div>

        <!-- Filter Category Tabs -->
        <div class="wishlist-category-pills">
          <button class="w-pill-btn active" onclick="filterWishlistCategory('ALL', this)">Semua Kategori</button>
          <button class="w-pill-btn" onclick="filterWishlistCategory('apparel', this)">Apparel</button>
          <button class="w-pill-btn" onclick="filterWishlistCategory('accessories', this)">Accessories</button>
          <button class="w-pill-btn" onclick="filterWishlistCategory('stationery', this)">Stationery</button>
          <button class="w-pill-btn" onclick="filterWishlistCategory('custom', this)">Custom Merch</button>
        </div>
      </div>

      <!-- Wishlist Grid -->
      <div class="wishlist-grid" id="wishlistContainer">
        <!-- Rendered via JS -->
      </div>

    </div>
  </main>

  <footer class="footer-strip">
    <div class="section-container footer-content">
      <div class="footer-copy">
        © 2026 WOLVY Campus Streetwear · All Rights Reserved. Built for Web Development Competition.
      </div>
      <div class="footer-links">
        <a href="shop.html">Shop</a>
        <a href="tryon.html">Virtual Try-On</a>
        <a href="orders.html">Status Pesanan</a>
        <a href="login.html">Login Admin</a>
      </div>
    </div>
  </footer>

  <script src="store.js"></script>
  <script>
    let activeCat = 'ALL';

    function renderWishlist() {
      const wishlistIds = wolvyStore.getWishlist();
      const allProducts = wolvyStore.getProducts();
      const container = document.getElementById('wishlistContainer');
      const badge = document.getElementById('cartBadge');
      if (badge) badge.innerText = wolvyStore.getCartCount();
      const wishlistCountEl = document.getElementById('wishlistCount');
      if (wishlistCountEl) wishlistCountEl.innerText = wishlistIds.length;
      document.getElementById('totalWishlistCount').innerText = wishlistIds.length;

      const savedProducts = allProducts.filter(p => wishlistIds.includes(p.id));
      const filtered = activeCat === 'ALL'
        ? savedProducts
        : savedProducts.filter(p => p.category === activeCat);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="wishlist-empty-state" style="grid-column: 1 / -1;">
            <div style="font-size:3rem; margin-bottom:12px;">💜</div>
            <h3 style="font-family:var(--font-heading); font-size:1.3rem; font-weight:800; color:var(--color-dark-purple); margin-bottom:6px;">
              Belum ada merchandise di kategori ini
            </h3>
            <p style="font-size:0.85rem; color:#7B689E; margin-bottom:18px;">
              Yuk temukan merchandise yang kamu taksir dan klik ikon hati untuk menyimpannya di sini!
            </p>
            <a href="shop.html" class="btn btn-primary" style="font-size:0.85rem; padding:10px 24px;">
              Jelajahi Katalog Shop
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(prod => `
        <div class="w-card">
          <div class="w-img-box">
            <span class="w-badge">${prod.badge || 'Populer'}</span>
            <button type="button" class="btn-remove-fav" title="Hapus dari Wishlist" onclick="removeFromWishlist(${prod.id})">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>
            </button>
            <img src="${prod.image}" alt="${prod.name}" class="w-img">
          </div>
          <div class="w-content">
            <span class="w-cat">${prod.category}</span>
            <a href="product-detail.html?id=${prod.id}" class="w-title">${prod.name}</a>
            <div class="w-price-row">
              <div class="w-price">${wolvyStore.formatPrice(prod.price)}</div>
              <button type="button" class="btn-add-cart-w" onclick="addWishlistToCart(${prod.id})">
                + Keranjang
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterWishlistCategory(cat, el) {
      activeCat = cat;
      document.querySelectorAll('.w-pill-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      renderWishlist();
    }

    function removeFromWishlist(id) {
      wolvyStore.toggleWishlist(id);
      renderWishlist();
    }

    function addWishlistToCart(id) {
      const prod = wolvyStore.getProductById(id);
      if (prod) {
        wolvyStore.addToCart(prod, prod.variants?.[0]?.sizes?.[0] || 'All Size', prod.variants?.[0]?.color || 'Standard', 1);
        const badge = document.getElementById('cartBadge');
        if (badge) badge.innerText = wolvyStore.getCartCount();
        alert(`🛒 ${prod.name} berhasil ditambahkan ke keranjang belanja!`);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderWishlist();
    });
  </script>
</body>
</html>
