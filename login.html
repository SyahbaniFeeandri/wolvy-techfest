<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Akun — WOLVY Campus Streetwear</title>
  <meta name="description" content="Masuk ke akun mahasiswa WOLVY untuk mengakses keranjang, checkout, dan riwayat pesanan merchandise kampus.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #25123F 0%, #130722 100%);
      padding: 40px 20px;
      color: #FFFFFF;
    }
    .auth-card {
      background: rgba(37, 18, 63, 0.7);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(205, 184, 244, 0.25);
      border-radius: var(--radius-2xl);
      padding: 40px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .auth-logo {
      display: block;
      margin: 0 auto 24px auto;
      height: 48px;
      object-fit: contain;
    }
    .auth-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--color-lavender);
      font-size: 0.88rem;
      margin-bottom: 28px;
    }
    .form-group-dark {
      margin-bottom: 18px;
    }
    .form-label-dark {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--color-lavender);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input-dark {
      width: 100%;
      padding: 12px 16px;
      background: rgba(19, 7, 34, 0.6);
      border: 1.5px solid rgba(205, 184, 244, 0.3);
      border-radius: var(--radius-md);
      color: #FFFFFF;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input-dark:focus {
      border-color: var(--color-neon-yellow);
      box-shadow: 0 0 0 3px rgba(232, 255, 56, 0.15);
    }
    .auth-tabs {
      display: flex;
      background: rgba(19, 7, 34, 0.7);
      padding: 4px;
      border-radius: var(--radius-pill);
      margin-bottom: 24px;
      border: 1px solid rgba(205, 184, 244, 0.25);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--color-lavender);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .auth-tab-btn.active {
      background: var(--color-neon-yellow);
      color: #120624;
      box-shadow: 0 4px 12px rgba(232, 255, 56, 0.35);
    }
    .btn-auth-submit {
      width: 100%;
      padding: 14px;
      background: var(--color-neon-yellow);
      color: #000000;
      border: none;
      border-radius: var(--radius-pill);
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(232, 255, 56, 0.3);
    }
    .btn-auth-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(232, 255, 56, 0.5);
    }

    /* Demo Quick Login Box for judges */
    .demo-login-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px dashed rgba(205, 184, 244, 0.25);
    }
    .demo-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--color-neon-yellow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      margin-bottom: 10px;
      display: block;
    }
    .demo-btns-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-demo-quick {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(205, 184, 244, 0.3);
      border-radius: var(--radius-md);
      color: #FFFFFF;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-demo-quick:hover {
      background: rgba(205, 184, 244, 0.2);
      border-color: var(--color-lavender);
    }
    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--color-lavender);
    }
    .auth-footer a {
      color: var(--color-neon-yellow);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="index.html">
      <img src="assets/wolvy_logo_clean.png" alt="WOLVY" class="auth-logo">
    </a>

    <!-- Mode Selector Tabs: Customer vs Admin -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab-btn active" id="tabCustomer" onclick="switchLoginMode('pelanggan')">
        <span>🛍️ Customer</span>
      </button>
      <button type="button" class="auth-tab-btn" id="tabAdmin" onclick="switchLoginMode('admin')">
        <span>🛡️ Admin Toko</span>
      </button>
    </div>

    <h1 class="auth-title" id="loginHeaderTitle">Masuk Akun Customer</h1>
    <p class="auth-subtitle" id="loginHeaderSubtitle">Akses katalog belanja dan kelola pesanan merchandise kampus</p>

    <div id="loginAlert" style="display:none; padding:12px 14px; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:18px; text-align:center;"></div>

    <form onsubmit="handleLoginSubmit(event)">
      <div class="form-group-dark">
        <label class="form-label-dark" for="loginIdentifier" id="lblIdentifier">Email atau Username</label>
        <input type="text" id="loginIdentifier" class="form-input-dark" value="aulia" placeholder="Masukkan email atau username" required>
      </div>

      <div class="form-group-dark">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label class="form-label-dark" for="loginPassword" style="margin-bottom:0;">Password</label>
          <a href="#" onclick="alert('Untuk reset password silakan hubungi CS WhatsApp WOLVY atau lakukan melalui dashboard Supabase Auth.')" style="font-size:0.75rem; color:var(--color-lavender); text-decoration:none;">Lupa Password?</a>
        </div>
        <input type="password" id="loginPassword" class="form-input-dark" value="password123" placeholder="Masukkan password" required>
      </div>

      <button type="submit" class="btn-auth-submit" id="btnSubmitLogin">
        Masuk Sebagai Customer ⚡
      </button>
    </form>

    <!-- 1-Click Demo Login for Competition Judges -->
    <div class="demo-login-box">
      <span class="demo-label">⭐ Quick Login Demo Lomba (1-Klik)</span>
      <div class="demo-btns-grid">
        <button type="button" class="btn-demo-quick" onclick="quickFillAndLogin('pelanggan')">
          👤 Customer Demo<br><span style="font-size:0.7rem; color:var(--color-lavender);">User: aulia</span>
        </button>
        <button type="button" class="btn-demo-quick" onclick="quickFillAndLogin('admin')">
          🛡️ Admin Demo<br><span style="font-size:0.7rem; color:var(--color-lavender);">User: admin</span>
        </button>
      </div>
    </div>

    <div class="auth-footer" id="loginFooterRegister">
      Belum punya akun? <a href="register.html">Daftar Customer Baru</a>
    </div>
  </div>

  <!-- CDN Supabase JS & Auth Helpers -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="store.js"></script>
  <script>
    let currentMode = 'pelanggan'; // 'pelanggan' | 'admin'

    // Periksa query parameter ?role=admin
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('role') === 'admin') {
        switchLoginMode('admin');
      }
    });

    function switchLoginMode(mode) {
      currentMode = mode;
      const tabCust = document.getElementById('tabCustomer');
      const tabAdm = document.getElementById('tabAdmin');
      const title = document.getElementById('loginHeaderTitle');
      const subtitle = document.getElementById('loginHeaderSubtitle');
      const btn = document.getElementById('btnSubmitLogin');
      const identifierInput = document.getElementById('loginIdentifier');
      const footReg = document.getElementById('loginFooterRegister');
      const alertBox = document.getElementById('loginAlert');
      if (alertBox) alertBox.style.display = 'none';

      if (mode === 'admin') {
        tabAdm.classList.add('active');
        tabCust.classList.remove('active');
        title.innerText = 'Login Administrator';
        subtitle.innerText = 'Khusus tim operasional & manajemen toko WOLVY';
        btn.innerText = 'Masuk Dashboard Admin 🛡️';
        identifierInput.value = 'admin';
        footReg.style.display = 'none';
      } else {
        tabCust.classList.add('active');
        tabAdm.classList.remove('active');
        title.innerText = 'Masuk Akun Customer';
        subtitle.innerText = 'Akses katalog belanja dan kelola pesanan merchandise kampus';
        btn.innerText = 'Masuk Sebagai Customer ⚡';
        identifierInput.value = 'aulia';
        footReg.style.display = 'block';
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnSubmitLogin');

      btn.disabled = true;
      btn.innerText = 'Memverifikasi Kredensial...';
      showAlert('Menghubungkan ke sistem otentikasi...', 'info');

      try {
        const res = await window.wolvyAuth.login(identifier, password, currentMode);
        if (res.success) {
          showAlert(res.message, 'success');
          setTimeout(() => {
            if (res.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 1000);
        } else {
          showAlert(res.message, 'error');
          btn.disabled = false;
          btn.innerText = currentMode === 'admin' ? 'Masuk Dashboard Admin 🛡️' : 'Masuk Sebagai Customer ⚡';
        }
      } catch (err) {
        showAlert('Terjadi kesalahan login: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerText = currentMode === 'admin' ? 'Masuk Dashboard Admin 🛡️' : 'Masuk Sebagai Customer ⚡';
      }
    }

    function quickFillAndLogin(mode) {
      switchLoginMode(mode);
      if (mode === 'admin') {
        document.getElementById('loginIdentifier').value = 'admin';
        document.getElementById('loginPassword').value = 'password123';
      } else {
        document.getElementById('loginIdentifier').value = 'aulia';
        document.getElementById('loginPassword').value = 'password123';
      }
      handleLoginSubmit(new Event('submit'));
    }

    function showAlert(msg, type) {
      const box = document.getElementById('loginAlert');
      box.style.display = 'block';
      box.innerText = msg;
      if (type === 'error') {
        box.style.background = 'rgba(239, 68, 68, 0.2)';
        box.style.border = '1px solid #EF4444';
        box.style.color = '#FCA5A5';
      } else if (type === 'success') {
        box.style.background = 'rgba(16, 185, 129, 0.2)';
        box.style.border = '1px solid #10B981';
        box.style.color = '#6EE7B7';
      } else {
        box.style.background = 'rgba(232, 255, 56, 0.15)';
        box.style.border = '1px solid var(--color-neon-yellow)';
        box.style.color = '#FFFFFF';
      }
    }
  </script>
</body>
</html>
