<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Mahasiswa — WOLVY Campus Streetwear</title>
  <meta name="description" content="Daftarkan dirimu sebagai bagian dari komunitas WOLVY untuk menikmati promo diskon eksklusif mahasiswa dan ikuti voting Design Battle.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #25123F 0%, #130722 100%);
      padding: 60px 20px;
      color: #FFFFFF;
    }
    .auth-card {
      background: rgba(37, 18, 63, 0.7);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(205, 184, 244, 0.25);
      border-radius: var(--radius-2xl);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .auth-logo {
      display: block;
      margin: 0 auto 20px auto;
      height: 48px;
      object-fit: contain;
    }
    .auth-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--color-lavender);
      font-size: 0.88rem;
      margin-bottom: 24px;
    }
    .form-row-auth {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .form-group-dark {
      margin-bottom: 14px;
    }
    .form-label-dark {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--color-lavender);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input-dark, .form-select-dark {
      width: 100%;
      padding: 11px 14px;
      background: rgba(19, 7, 34, 0.6);
      border: 1.5px solid rgba(205, 184, 244, 0.3);
      border-radius: var(--radius-md);
      color: #FFFFFF;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input-dark:focus, .form-select-dark:focus {
      border-color: var(--color-neon-yellow);
      box-shadow: 0 0 0 3px rgba(232, 255, 56, 0.15);
    }
    .form-select-dark option {
      background: #130722;
      color: #FFFFFF;
    }
    .btn-auth-submit {
      width: 100%;
      padding: 14px;
      background: var(--color-neon-yellow);
      color: #000000;
      border: none;
      border-radius: var(--radius-pill);
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(232, 255, 56, 0.3);
    }
    .btn-auth-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(232, 255, 56, 0.5);
    }
    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--color-lavender);
    }
    .auth-footer a {
      color: var(--color-neon-yellow);
      text-decoration: none;
      font-weight: 700;
    }
    @media (max-width: 600px) {
      .form-row-auth {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="index.html">
      <img src="assets/wolvy_logo_clean.png" alt="WOLVY" class="auth-logo">
    </a>

    <h1 class="auth-title">Daftar Akun Customer</h1>
    <p class="auth-subtitle">Gabung ke komunitas streetwear kampus WOLVY</p>

    <div id="registerAlert" style="display:none; padding:12px 14px; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:18px; text-align:center;"></div>

    <form onsubmit="handleRegisterSubmit(event)">
      <div class="form-group-dark">
        <label class="form-label-dark" for="regEmail">Email Aktif *</label>
        <input type="email" id="regEmail" class="form-input-dark" placeholder="nama@email.com atau nama@kampus.ac.id" required>
      </div>

      <div class="form-row-auth">
        <div>
          <label class="form-label-dark" for="regUsername">Username *</label>
          <input type="text" id="regUsername" class="form-input-dark" placeholder="Contoh: dimas_wolvy" pattern="^[a-zA-Z0-9_]{3,20}$" title="3-20 karakter, huruf/angka/underscore" required>
        </div>
        <div>
          <label class="form-label-dark" for="regName">Nama Lengkap</label>
          <input type="text" id="regName" class="form-input-dark" placeholder="Nama mahasiswa / customer">
        </div>
      </div>

      <div class="form-row-auth">
        <div>
          <label class="form-label-dark" for="regPassword">Password *</label>
          <input type="password" id="regPassword" class="form-input-dark" placeholder="Minimal 6 karakter" minlength="6" required>
        </div>
        <div>
          <label class="form-label-dark" for="regPasswordConfirm">Konfirmasi Password *</label>
          <input type="password" id="regPasswordConfirm" class="form-input-dark" placeholder="Ulangi password" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn-auth-submit" id="btnSubmitRegister">
        Daftar Akun Sekarang ⚡
      </button>
    </form>

    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </div>
  </div>

  <!-- CDN Supabase JS & Auth Helpers -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="store.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitRegister');
      const alertBox = document.getElementById('registerAlert');

      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const fullName = document.getElementById('regName').value.trim() || username;
      const p1 = document.getElementById('regPassword').value;
      const p2 = document.getElementById('regPasswordConfirm').value;

      if (p1 !== p2) {
        showAlert('Password dan Konfirmasi Password tidak sama!', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Memproses Pendaftaran...';
      showAlert('Mendaftarkan akun ke backend...', 'info');

      try {
        const res = await window.wolvyAuth.register({
          email,
          username,
          password: p1,
          fullName
        });

        if (res.success) {
          showAlert(res.message, 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);
        } else {
          showAlert(res.message, 'error');
          btn.disabled = false;
          btn.innerText = 'Daftar Akun Sekarang ⚡';
        }
      } catch (err) {
        showAlert('Terjadi kesalahan koneksi: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Daftar Akun Sekarang ⚡';
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById('registerAlert');
      box.style.display = 'block';
      box.innerText = msg;
      if (type === 'error') {
        box.style.background = 'rgba(239, 68, 68, 0.2)';
        box.style.border = '1px solid #EF4444';
        box.style.color = '#FCA5A5';
      } else if (type === 'success') {
        box.style.background = 'rgba(16, 185, 129, 0.2)';
        box.style.border = '1px solid #10B981';
        box.style.color = '#6EE7B7';
      } else {
        box.style.background = 'rgba(232, 255, 56, 0.15)';
        box.style.border = '1px solid var(--color-neon-yellow)';
        box.style.color = '#FFFFFF';
      }
    }
  </script>
</body>
</html>
